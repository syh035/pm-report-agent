<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>提示词库 · PM Report Agent</title>
<style>
  :root { --primary:#4A6CF7; --bg:#F7F8FA; --card:#fff; --border:#E4E7EC; --text:#2D3142; --muted:#6B6B80; --danger:#C0504D; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:24px 32px; }
  h1 { font-size:19px; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:18px; }
  .back { text-decoration:none; color:var(--primary); font-size:13px; float:right; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .card h3 { font-size:14px; margin-bottom:6px; }
  .label { font-size:11px; color:var(--muted); margin:8px 0 4px; }
  textarea { width:100%; border:1px solid var(--border); border-radius:6px; padding:8px; font-size:12px; font-family:inherit; }
  .edited { color:#D97706; font-size:11px; margin-left:8px; }
  .btn { border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-danger { background:var(--danger); color:#fff; }
  .row { display:flex; gap:8px; margin-top:10px; }
  .mini { float:right; font-size:11px; padding:3px 10px; background:#F0F2F5; color:var(--text); }
</style>
</head>
<body>
<div class="sub" style="display:flex;justify-content:space-between;align-items:center;">
  <div><h1>提示词库</h1><div>全部 AI 提示词（system / user / few-shot 示例）· 可直接编辑保存，立即生效</div></div>
  <a class="back" href="/libraries.html">← 返回数据库中心</a>
</div>
<div id="list"></div>
<div class="row">
  <button class="btn btn-primary" onclick="saveAll()">保存全部修改</button>
  <button class="btn btn-danger" onclick="resetAll()">恢复全部默认</button>
  <span id="msg" style="font-size:12px;color:var(--muted);align-self:center;"></span>
</div>
<script>
const $ = id => document.getElementById(id);
let promptState = {};
async function load(){
  const d = await (await fetch('/api/settings/prompts')).json();
  const items = d.items||[];
  promptState = {};
  $('list').innerHTML = items.map(it=>{
    promptState[it.key] = { system:it.system, user:it.user, examples:(it.examples||[]).join('\n---\n'),
      defSystem:it.default_system, defUser:it.default_user, defExamples:(it.default_examples||[]).join('\n---\n') };
    const ph = Object.keys(it.docs||{}).join(' ');
    return `<div class="card">
      <h3>${esc(it.label)}${it.modified?'<span class="edited">(已修改)</span>':''}
        <button class="btn mini" onclick="resetOne('${it.key}')">恢复该项默认</button>
      </h3>
      <div class="label">SYSTEM（角色与纪律）</div>
      <textarea rows="2" onchange="promptState['${it.key}'].system=this.value">${esc(it.system)}</textarea>
      <div class="label">USER（模板，占位符：${esc(ph)}）</div>
      <textarea rows="6" onchange="promptState['${it.key}'].user=this.value">${esc(it.user)}</textarea>
      <div class="label">示例 few-shot（多个用 --- 分隔）</div>
      <textarea rows="2" onchange="promptState['${it.key}'].examples=this.value">${esc(promptState[it.key].examples)}</textarea>
    </div>`;
  }).join('');
}
async function saveAll(){
  const payload = {};
  for(const k in promptState){
    const p = promptState[k];
    const examples = (p.examples||'').split('\n---\n').map(s=>s.trim()).filter(Boolean);
    const defEx = (p.defExamples||'').split('\n---\n').map(s=>s.trim()).filter(Boolean);
    const changed = p.system!==p.defSystem || p.user!==p.defUser || examples.join('|')!==defEx.join('|');
    if(changed) payload[k] = {system:p.system, user:p.user, examples};
  }
  if(!Object.keys(payload).length){ $('msg').textContent='没有修改'; return; }
  $('msg').textContent='保存中...';
  const res = await fetch('/api/settings/prompts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompts:payload})});
  const d = await res.json();
  $('msg').textContent = res.ok ? (d.note||'已保存') : (d.detail||'保存失败');
  if(res.ok) load();
}
async function resetOne(key){
  if(!confirm('恢复该提示词默认？')) return;
  await fetch('/api/settings/prompts/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keys:[key]})});
  load();
}
async function resetAll(){
  if(!confirm('恢复全部默认提示词？')) return;
  await fetch('/api/settings/prompts/reset',{method:'POST'});
  load();
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
load();
</script>
</body>
</html>
