<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模板库 · PM Report Agent</title>
<style>
  :root { --primary:#4A6CF7; --bg:#F7F8FA; --card:#fff; --border:#E4E7EC; --text:#2D3142; --muted:#6B6B80; --danger:#C0504D; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:24px 32px; }
  h1 { font-size:19px; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:18px; }
  .back { text-decoration:none; color:var(--primary); font-size:13px; float:right; }
  .layout { display:flex; gap:20px; flex-wrap:wrap; }
  .cal-panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; flex:1; min-width:320px; max-width:420px; }
  .list-panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; flex:2; min-width:320px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-head button { background:#EEF2FF; border:none; color:var(--primary); border-radius:6px; padding:3px 12px; cursor:pointer; font-size:14px; }
  .cal-head .ym { font-weight:700; font-size:15px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-grid .dow { text-align:center; font-size:11px; color:var(--muted); padding:4px 0; }
  .cal-day { text-align:center; padding:7px 0; border-radius:8px; font-size:13px; cursor:pointer; }
  .cal-day.has { background:#EEF2FF; font-weight:600; color:var(--primary); }
  .cal-day.sel { background:var(--primary); color:#fff; }
  .filters { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .f { background:#F0F2F5; border:none; border-radius:8px; padding:3px 12px; font-size:12px; cursor:pointer; }
  .f.on { background:var(--primary); color:#fff; }
  select { border:1px solid var(--border); border-radius:8px; padding:4px 8px; font-size:12px; }
  .item { display:flex; align-items:center; gap:10px; padding:9px 6px; border-bottom:1px solid var(--border); font-size:13px; }
  .item:last-child { border-bottom:none; }
  .item .name { flex:1; }
  .item a { color:var(--primary); text-decoration:none; font-size:12px; }
  .tag { font-size:10px; background:#EEF2FF; color:var(--primary); border-radius:8px; padding:1px 7px; }
  .tag.latest { background:#F0FDF4; color:#166534; }
  .empty { color:var(--muted); font-size:13px; padding:20px 6px; }
  .op { font-size:11px; padding:3px 9px; border:none; border-radius:6px; cursor:pointer; }
  .op.apply { background:var(--primary); color:#fff; }
  .op.del { background:#FDEBEA; color:var(--danger); }
</style>
</head>
<body>
<div class="sub" style="display:flex;justify-content:space-between;align-items:center;">
  <div><h1>模板库</h1><div>命名入库的模板 · 区分周报/日报 · 可按日期（日历）与分类选取 · 默认最新</div></div>
  <a class="back" href="/libraries.html">← 返回数据库中心</a>
</div>
<div class="layout">
  <div class="cal-panel">
    <div class="cal-head">
      <button onclick="calMove(-1)">‹</button>
      <span class="ym" id="calYM" title="点击选择年份/月份"></span>
      <button onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div style="font-size:11px;color:var(--muted);margin-top:10px;">● 有模板入库的日期可点击</div>
  </div>
  <div class="list-panel">
    <div class="filters">
      <button class="f on" data-t="" onclick="setType(this,'')">全部</button>
      <button class="f" data-t="week" onclick="setType(this,'week')">周报</button>
      <button class="f" data-t="day" onclick="setType(this,'day')">日报</button>
      <button class="f" data-t="other" onclick="setType(this,'other')">其他</button>
      <select id="catSel" onchange="setCat(this.value)"><option value="">全部分类</option></select>
    </div>
    <h3 style="font-size:14px;margin-bottom:10px;" id="listTitle">模板列表</h3>
    <div id="tplList"></div>
  </div>
</div>
<script src="/lib/cal.js"></script>
<script>
const $ = id => document.getElementById(id);
let curYear=new Date().getFullYear(), curMonth=new Date().getMonth()+1;
let items=[], cats=[], byDate={}, selDate='', ftype='', fcat='';
async function load(){
  const d = await (await fetch('/api/template/lib')).json();
  items = d.items||[]; cats = d.categories||[];
  $('catSel').innerHTML = '<option value="">全部分类</option>' + cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  byDate = {};
  items.forEach(it=>{ const day=(it.created_at||'').slice(0,10); (byDate[day]=byDate[day]||[]).push(it); });
  bindCalPicker($('calYM'), (y,m)=>{ curYear=y; curMonth=m; renderCal(); });
  renderCal();
  const tk = new Date();
  const key = `${tk.getFullYear()}-${String(tk.getMonth()+1).padStart(2,'0')}-${String(tk.getDate()).padStart(2,'0')}`;
  selectDate(byDate[key]?key:Object.keys(byDate).sort().pop()||'');
}
function calMove(d){ curMonth+=d; if(curMonth<1){curMonth=12;curYear--;} if(curMonth>12){curMonth=1;curYear++;} renderCal(); }
function renderCal(){
  $('calYM').textContent = `${curYear} 年 ${curMonth} 月`;
  const first=new Date(curYear,curMonth-1,1), dim=new Date(curYear,curMonth,0).getDate(), sw=first.getDay();
  let html=['日','一','二','三','四','五','六'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<sw;i++) html+='<div class="cal-day" style="cursor:default"></div>';
  for(let d=1;d<=dim;d++){
    const key=`${curYear}-${String(curMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=byDate[key]&&byDate[key].length;
    html+=`<div class="cal-day ${has?'has':''} ${key===selDate?'sel':''}" onclick="selectDate('${key}')">${d}</div>`;
  }
  $('calGrid').innerHTML=html;
}
function setType(btn,t){ ftype=t; document.querySelectorAll('.f').forEach(b=>b.classList.toggle('on', b.dataset.t===t)); renderList(); }
function setCat(c){ fcat=c; renderList(); }
function selectDate(key){ selDate=key; renderCal(); renderList(); }
function renderList(){
  let list = selDate ? (byDate[selDate]||[]) : items;
  if(ftype) list = list.filter(it=>it.ttype===ftype);
  if(fcat) list = list.filter(it=>it.category===fcat);
  $('listTitle').textContent = `模板（${list.length}）`;
  const latestId = list.length ? list[0].id : null;
  $('tplList').innerHTML = list.length ? list.map(it=>`
    <div class="item">
      <span class="name">${esc(it.name)} ${it.id===latestId?'<span class="tag latest">最新</span>':''}</span>
      <span class="tag">${it.ttype==='week'?'周报':it.ttype==='day'?'日报':'其他'}</span>
      ${it.category?`<span class="tag">${esc(it.category)}</span>`:''}
      <span style="font-size:11px;color:var(--muted)">${esc((it.created_at||'').slice(0,16))}</span>
      <button class="op apply" onclick="applyTpl(${it.id})">应用</button>
      <button class="op" onclick="viewTpl(${it.id})">查看</button>
      <button class="op del" onclick="delTpl(${it.id})">删除</button>
    </div>`).join('') : '<div class="empty">该条件下没有模板（在主面板「模板准备」上传解析后命名入库）</div>';
}
async function applyTpl(id){
  if(!confirm('应用该模板为当前生效模板？')) return;
  const r = await fetch('/api/template/lib/'+id+'/apply');
  const d = await r.json();
  if(!r.ok){ alert(d.detail||'失败'); return; }
  alert(d.note||'已应用');
}
function viewTpl(id){
  const w = window.open('', '_blank');
  fetch('/api/template/lib').then(r=>r.json()).then(d=>{
    const it = (d.items||[]).find(x=>x.id===id);
    w.document.write('<html><head><meta charset="utf-8"><title>模板</title></head><body style="font-family:sans-serif;padding:20px;">'+(it?.html||'<p>无</p>')+'</body></html>');
    w.document.close();
  });
}
async function delTpl(id){
  if(!confirm('删除该模板？')) return;
  await fetch('/api/template/lib/'+id,{method:'DELETE'});
  load();
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
load();
</script>
</body>
</html>
