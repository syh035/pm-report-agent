<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📋 模板库 · PM Report Agent</title>
<style>
  :root { --primary:#4A6CF7; --bg:#F7F8FA; --card:#fff; --border:#E4E7EC; --text:#2D3142; --muted:#6B6B80; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:24px 32px; }
  h1 { font-size:19px; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:18px; }
  .back { text-decoration:none; color:var(--primary); font-size:13px; float:right; }
  .layout { display:flex; gap:20px; flex-wrap:wrap; }
  .cal-panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; flex:1; min-width:320px; max-width:420px; }
  .list-panel { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; flex:2; min-width:320px; }
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-head button { background:#EEF2FF; border:none; color:var(--primary); border-radius:6px; padding:3px 12px; cursor:pointer; font-size:14px; }
  .cal-head .ym { font-weight:700; font-size:15px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-grid .dow { text-align:center; font-size:11px; color:var(--muted); padding:4px 0; }
  .cal-day { text-align:center; padding:7px 0; border-radius:8px; font-size:13px; cursor:pointer; }
  .cal-day.has { background:#EEF2FF; font-weight:600; color:var(--primary); }
  .cal-day.has::after { content:''; display:block; width:4px; height:4px; border-radius:50%; background:var(--primary); margin:1px auto 0; }
  .cal-day.sel { background:var(--primary); color:#fff; }
  .cal-day.sel::after { background:#fff; }
  .item { display:flex; align-items:center; gap:10px; padding:9px 6px; border-bottom:1px solid var(--border); font-size:13px; }
  .item .name { flex:1; }
  .preview { font-size:11px; color:var(--muted); max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag { font-size:10px; background:#EEF2FF; color:var(--primary); border-radius:8px; padding:1px 7px; }
  .empty { color:var(--muted); font-size:13px; padding:20px 6px; }
  .cur { background:#F0FDF4; border:1px solid #BBF7D0; border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:13px; }
</style>
</head>
<body>
<div class="sub" style="display:flex;justify-content:space-between;align-items:center;">
  <div><h1>📋 模板库</h1><div>当前模板 + 版本历史（按日期日历）· 在「模板」面板保存新版本后这里可回溯</div></div>
  <a class="back" href="/libraries.html" target="_blank">← 返回数据库中心</a>
</div>
<div class="layout">
  <div class="cal-panel">
    <div class="cal-head">
      <button onclick="calMove(-1)">‹</button>
      <span class="ym" id="calYM"></span>
      <button onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div style="font-size:11px;color:var(--muted);margin-top:10px;">● 有保存版本的日期可点击</div>
  </div>
  <div class="list-panel">
    <div class="cur" id="curTpl">加载中…</div>
    <h3 style="font-size:14px;margin-bottom:10px;" id="listTitle">🕘 模板版本历史</h3>
    <div id="tplList"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let curYear=new Date().getFullYear(), curMonth=new Date().getMonth()+1;
let hist=[], byDate={}, selDate='';
async function load(){
  try{
    const t = await (await fetch('/api/template')).json();
    const fmt = t.format||'html';
    const cur = fmt==='blocks' ? `Blocks 模板（${(t.blocks||[]).length} 个模块）` : (t.html||'（空模板）').slice(0,200);
    $('curTpl').innerHTML = `<b>当前模板</b>（${fmt==='blocks'?'Blocks':'HTML'}）：<div style="margin-top:6px;color:var(--muted);white-space:pre-wrap;">${esc(cur)}${(cur||'').length>190?'…':''}</div>`;
  }catch(e){ $('curTpl').textContent='加载模板失败'; }
  const d = await (await fetch('/api/template/history')).json();
  hist = d.items||[];
  byDate = {};
  for(const it of hist){ const day=(it.ts||'').slice(0,10); (byDate[day]=byDate[day]||[]).push(it); }
  renderCal();
  const tk = `${curYear}-${String(curMonth).padStart(2,'0')}-${String(new Date().getDate()).padStart(2,'0')}`;
  selectDate(byDate[tk]?tk:Object.keys(byDate).sort().pop()||'');
}
function calMove(d){ curMonth+=d; if(curMonth<1){curMonth=12;curYear--;} if(curMonth>12){curMonth=1;curYear++;} renderCal(); }
function renderCal(){
  $('calYM').textContent = `${curYear} 年 ${curMonth} 月`;
  const first=new Date(curYear,curMonth-1,1), dim=new Date(curYear,curMonth,0).getDate(), sw=first.getDay();
  let html=['日','一','二','三','四','五','六'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<sw;i++) html+='<div class="cal-day" style="cursor:default"></div>';
  for(let d=1;d<=dim;d++){
    const key=`${curYear}-${String(curMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has=byDate[key]&&byDate[key].length;
    html+=`<div class="cal-day ${has?'has':''} ${key===selDate?'sel':''}" onclick="selectDate('${key}')">${d}</div>`;
  }
  $('calGrid').innerHTML=html;
}
function selectDate(key){ selDate=key; renderCal(); renderList(); }
function renderList(){
  const items = selDate?(byDate[selDate]||[]):hist;
  $('listTitle').textContent = `🕘 ${selDate||'全部'} 模板版本（${items.length}）`;
  $('tplList').innerHTML = items.length ? items.map((it,i)=>`
    <div class="item">
      <span class="name">🕘 ${esc(it.ts||'')}</span>
      <span class="tag">${it.fmt==='blocks'?'Blocks':'HTML'}</span>
      <span class="preview">${esc(it.preview||'')}${(it.preview||'').length>=190?'…':''}</span>
    </div>`).join('') : '<div class="empty">该日期没有模板版本（保存模板时会自动记录）</div>';
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
load();
</script>
</body>
</html>
