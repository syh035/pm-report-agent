<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🗂 分类数据仓 · PM Report Agent</title>
<style>
  :root { --primary:#4A6CF7; --bg:#F7F8FA; --card:#fff; --border:#E4E7EC; --text:#2D3142; --muted:#6B6B80; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:24px 32px; }
  h1 { font-size:19px; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:18px; }
  .back { text-decoration:none; color:var(--primary); font-size:13px; float:right; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tab { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:4px 14px; font-size:12px; cursor:pointer; }
  .tab.on { background:var(--primary); color:#fff; border-color:var(--primary); }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; }
  th { background:#F0F2F5; text-align:left; font-size:11px; padding:8px 10px; color:var(--muted); }
  td { border-top:1px solid var(--border); padding:7px 10px; font-size:12px; }
  .kinds { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .kind { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:8px 14px; font-size:12px; }
  .kind b { color:var(--primary); }
</style>
</head>
<body>
<div class="sub" style="display:flex;justify-content:space-between;align-items:center;">
  <div><h1>🗂 分类数据仓</h1><div>任务 / 风险 / 里程碑 / 指标 / 决策 / 依赖 / 原始，按分类 + 时间存储</div></div>
  <a class="back" href="/libraries.html">← 返回数据库中心</a>
</div>
<div class="kinds" id="kinds"></div>
<div class="tabs" id="tabs"></div>
<table>
  <thead><tr><th>分类</th><th>名称</th><th>详情</th><th>周期</th><th>入库时间</th><th>来源</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const KINDS = [
  ['task','任务','#2563EB'],['risk','风险','#A33A37'],['issue','依赖/问题','#0E7490'],
  ['decision','决策','#D97706'],['milestone','里程碑','#8B5CF6'],['metric','指标','#4A7A1E'],['raw','原始','#6B7280']
];
const $ = id => document.getElementById(id);
let curKind = 'task', curPeriod = '', allPeriods = new Set();

async function load(){
  $('kinds').innerHTML = KINDS.map(([k,label,c])=>`
    <div class="kind" style="cursor:pointer;${k===curKind?'border-color:var(--primary);':''}" onclick="curKind='${k}';loadRows();$('kinds').innerHTML=this.outerHTML;renderTabs();">
      <span style="color:${c}">●</span> ${label} <b id="cnt_${k}">…</b>
    </div>`).join('');
  // 统计
  const summary = await (await fetch('/api/sources')).json();
  const s = summary.summary||{};
  for(const [k] of KINDS){ const el=document.getElementById('cnt_'+k); if(el) el.textContent = s[k]||0; }
  await loadRows();
}
async function loadRows(){
  const d = await (await fetch('/api/items?kind='+curKind+(curPeriod?'&period='+encodeURIComponent(curPeriod):''))).json();
  const items = d.items||[];
  items.forEach(it=>{ if(it.period) allPeriods.add(it.period); });
  renderTabs();
  $('rows').innerHTML = items.length ? items.map(it=>{
    const p = it.payload||{};
    const detail = Object.entries(p).filter(([k])=>!['section'].includes(k)).slice(0,4)
      .map(([k,v])=>`<span style="color:var(--muted)">${esc(k)}:</span> ${esc(String(v).slice(0,40))}`).join(' · ');
    return `<tr><td>${kindLabel(it.kind)}</td><td>${esc(it.name)}</td><td>${detail||'—'}</td><td>${esc(it.period||'')}</td><td>${esc((it.created_at||'').slice(5,16))}</td><td style="font-size:11px;color:var(--muted)">${esc((it.source_id||'').slice(0,8))}</td></tr>`;
  }).join('') : '<tr><td colspan="6" style="color:var(--muted);padding:20px;">该分类暂无数据</td></tr>';
}
function renderTabs(){
  $('tabs').innerHTML = ['<button class="tab '+(curPeriod===''?'on':'')+'" onclick="curPeriod=\'\';loadRows()">全部</button>']
    .concat([...allPeriods].sort().map(p=>`<button class="tab ${p===curPeriod?'on':''}" onclick="curPeriod='${esc(p)}';loadRows()">${esc(p)}</button>`)).join('');
}
function kindLabel(k){ const f=KINDS.find(x=>x[0]===k); return f?f[1]:k; }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
load();
</script>
</body>
</html>
