<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧩 自定义 Block 库 · PM Report Agent</title>
<style>
  :root { --primary:#4A6CF7; --bg:#F7F8FA; --card:#fff; --border:#E4E7EC; --text:#2D3142; --muted:#6B6B80; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:24px 32px; }
  h1 { font-size:19px; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:18px; }
  .back { text-decoration:none; color:var(--primary); font-size:13px; float:right; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
  .blk { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .blk h3 { font-size:14px; margin-bottom:6px; }
  .blk .type { font-size:10px; background:#EEF2FF; color:var(--primary); border-radius:8px; padding:1px 7px; }
  .blk pre { background:var(--bg); border-radius:6px; padding:8px; font-size:11px; color:var(--muted); max-height:120px; overflow:auto; white-space:pre-wrap; }
  .empty { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="sub" style="display:flex;justify-content:space-between;align-items:center;">
  <div><h1>🧩 自定义 Block 库</h1><div>AI 提示词块 / 公式计算块 · 在模板编辑器保存后可复用</div></div>
  <a class="back" href="/libraries.html" target="_blank">← 返回数据库中心</a>
</div>
<div class="grid" id="blkGrid"></div>
<script>
async function load(){
  const d = await (await fetch('/api/custom_blocks')).json();
  const blocks = d.blocks||[];
  const grid = document.getElementById('blkGrid');
  grid.innerHTML = blocks.length ? blocks.map(b=>{
    const def = b.definition||{};
    const type = def.type==='formula' ? '🧮 公式块' : (def.type==='ai_block' ? '🤖 AI 提示词块' : (def.type||'?'));
    const detail = def.type==='formula' ? `表达式：${def.expression||''}` : `数据源：${def.data_scope||''}<br>提示词：${(def.prompt||'').slice(0,120)}`;
    return `<div class="blk"><h3>${esc(b.name)} <span class="type">${type}</span></h3><pre>${esc(detail)}</pre></div>`;
  }).join('') : '<div class="empty">暂无自定义 Block —— 在「模板」面板的模块库中保存</div>';
}
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
load();
</script>
</body>
</html>
