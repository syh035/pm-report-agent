<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>规则库 · PM Report Agent</title>
<style>
  :root { --primary:#4A6CF7; --bg:#F7F8FA; --card:#fff; --border:#E4E7EC; --text:#2D3142; --muted:#6B6B80; --danger:#C0504D; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:24px 32px; }
  h1 { font-size:19px; margin-bottom:4px; }
  .sub { font-size:13px; color:var(--muted); margin-bottom:18px; }
  .back { text-decoration:none; color:var(--primary); font-size:13px; float:right; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:16px; }
  .card h3 { font-size:14px; margin-bottom:10px; }
  .converse { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  input[type=text], textarea { flex:1; min-width:240px; border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:13px; }
  .btn { border:none; border-radius:8px; padding:7px 16px; font-size:13px; cursor:pointer; }
  .btn-primary { background:var(--primary); color:#fff; }
  .btn-outline { background:#fff; border:1px solid var(--border); color:var(--text); }
  .btn-danger { background:var(--danger); color:#fff; }
  .btn-sm { font-size:11px; padding:3px 9px; border-radius:6px; }
  .draft { background:#EEF2FF; border:1px solid #C7D2FE; border-radius:10px; padding:12px 14px; margin-top:10px; font-size:13px; }
  .req { background:#F0FDF4; border:1px solid #BBF7D0; border-radius:10px; padding:10px 14px; margin-bottom:8px; font-size:13px; }
  .req b { color:#166534; }
  .req .meta { font-size:11px; color:var(--muted); margin-top:2px; }
  .kv { display:flex; justify-content:space-between; align-items:center; padding:7px 4px; border-bottom:1px solid var(--border); font-size:13px; }
  .kv:last-child { border-bottom:none; }
  .kv .v { color:var(--primary); font-weight:600; }
  .tag { display:inline-block; font-size:10px; background:#EEF2FF; color:var(--primary); border-radius:8px; padding:1px 7px; margin-left:6px; }
  .import-box { border:1px dashed var(--border); border-radius:10px; padding:12px; margin-top:10px; }
  .import-drafts { margin-top:8px; }
  .draft-item { display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px dashed var(--border); font-size:13px; }
  .ck { width:14px; height:14px; accent-color:var(--primary); }
</style>
</head>
<body>
<div class="sub" style="display:flex;justify-content:space-between;align-items:center;">
  <div><h1>规则库</h1><div>分析要求（数据筛选/抽取）＋ 生成要求（文稿格式/口径）· 对话式添加 · 文档一键导入 · 可删除/批量删除</div></div>
  <a class="back" href="/libraries.html">← 返回数据库中心</a>
</div>

<div class="card">
  <h3>对话式添加规则（AI 理解 → 人工确认 → 写入）</h3>
  <div class="converse">
    <input type="text" id="ruleIn" placeholder="例：风险超过7天标记高风险 / 周报风险部分按等级降序排列 / 进度落后30%以上标关注" onkeydown="if(event.key==='Enter')converse()">
    <button class="btn btn-primary" onclick="converse()">AI 理解</button>
  </div>
  <div id="draftBox"></div>
  <div id="converseMsg" style="font-size:12px;color:var(--muted);"></div>
</div>

<div class="card">
  <h3>规则总览
    <input type="text" id="ruleSearch" placeholder="搜索规则…（标题/内容/类型）" style="max-width:280px;font-size:12px;margin-left:10px;" oninput="renderAll()">
  </h3>
  <div id="overviewList" style="font-size:12px;color:var(--muted);"></div>
</div>

<div class="card">
  <h3>规则文档一键导入（txt/md/Word/PDF → AI 批量理解 → 勾选确认）</h3>
  <div class="converse">
    <input type="file" id="ruleDocFile" accept=".txt,.md,.docx,.pdf,.html,.htm" style="font-size:12px;">
    <button class="btn btn-outline" onclick="extractRuleDoc()">载入文档</button>
    <select id="ruleImportType" style="font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;" title="导入后按指定类型处理（或让 AI 自动判断）">
      <option value="">类型：AI 自动判断</option>
      <option value="requirement">全部按「分析要求」</option>
      <option value="generation_requirement">全部按「生成要求」</option>
    </select>
    <button class="btn btn-primary" onclick="importRuleDoc()">AI 批量理解</button>
  </div>
  <div id="ruleDocHint" style="font-size:12px;color:var(--muted);"></div>
  <div id="importDrafts" class="import-drafts"></div>
</div>

<div class="card">
  <h3>分析要求（requirements — 数据筛选/抽取时的要求）
    <button class="btn btn-danger btn-sm" style="float:right" onclick="batchDel('requirement')">批量删除选中</button>
  </h3>
  <div id="reqList"></div>
</div>

<div class="card">
  <h3>生成要求（generation_requirements — 文稿生成时的要求）
    <button class="btn btn-danger btn-sm" style="float:right" onclick="batchDel('generation_requirement')">批量删除选中</button>
  </h3>
  <div id="genReqList"></div>
</div>

<div class="card">
  <h3>规则参数（点击数值可修改）</h3>
  <div id="rulesList"></div>
</div>

<script src="/lib/chatbox.js"></script>
<script>
const $ = id => document.getElementById(id);
let rules = {}, meta = {}, pendingDraft = null, importDrafts = [];
let reqSel = {}, genSel = {};   // 批量删除勾选

async function load(){
  const d = await (await fetch('/api/rules')).json();
  rules = d.rules||{}; meta = d.meta||{};
  // 分析要求
  const reqs = rules.requirements||[];
  $('reqList').innerHTML = reqs.length ? reqs.map((r,ri)=>`
    <div class="req"><label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;">
      <input type="checkbox" class="ck" data-req="${ri}" onchange="toggleSel('req',${ri},this.checked)">
      <span style="flex:1;"><b>${esc(r.title)}</b> <span class="tag">${esc(r.scope||'全部')}</span><span class="tag">${esc(r.applies_to||'全部')}</span>
      <div>${esc(r.description)}</div></span></label>
      <button class="btn btn-danger btn-sm" onclick="delRule('requirement',${ri})">删除</button></div>`).join('')
    : '<div style="color:var(--muted);font-size:13px;">暂无分析要求</div>';
  // 生成要求
  const gens = rules.generation_requirements||[];
  $('genReqList').innerHTML = gens.length ? gens.map((r,ri)=>`
    <div class="req"><label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;">
      <input type="checkbox" class="ck" data-gen="${ri}" onchange="toggleSel('gen',${ri},this.checked)">
      <span style="flex:1;"><b>${esc(r.title)}</b> <span class="tag">${esc(r.scope||'全部')}</span><span class="tag">${esc(r.applies_to||'全部')}</span>
      <div>${esc(r.description)}</div></span></label>
      <button class="btn btn-danger btn-sm" onclick="delRule('generation_requirement',${ri})">删除</button></div>`).join('')
    : '<div style="color:var(--muted);font-size:13px;">暂无生成要求</div>';
  // 规则参数（FormKit 动态表单：分组折叠 + 搜索 + 自动控件）
  renderAll();
  loadKit();
}
async function loadKit(){
  try{
    const d = await (await fetch('/api/config-schema')).json();
    window._kitSchema = d.schema.rules;
    window._kitValue = JSON.parse(JSON.stringify(d.rules));
    window._kitOpts = {
      onSave: async ()=>{
        const res = await fetch('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify(window._kitValue)});
        const dr = await res.json();
        if(!res.ok){ alert('保存失败: '+(dr.detail||JSON.stringify(dr))); return; }
        alert('已保存并写入历史'); load();
      }
    };
    kitInit('rulesList', window._kitSchema, window._kitValue, window._kitOpts);
  }catch(e){ document.getElementById('rulesList').innerHTML='<div style="color:var(--muted);font-size:13px;">加载规则参数失败: '+kitEsc(String(e))+'</div>'; }
}
function renderAll(){
  const box = document.getElementById('overviewList'); if(!box) return;
  const kw = (document.getElementById('ruleSearch')?.value||'').trim().toLowerCase();
  const rows = [];
  (rules.requirements||[]).forEach(r=>rows.push({t:'分析要求', title:r.title, desc:r.description}));
  (rules.generation_requirements||[]).forEach(r=>rows.push({t:'生成要求', title:r.title, desc:r.description}));
  Object.keys(rules.status_words||{}).forEach(k=>rows.push({t:'状态词', title:k+'='+rules.status_words[k], desc:''}));
  Object.keys(rules.column_aliases||{}).forEach(k=>rows.push({t:'列名', title:k+'='+rules.column_aliases[k], desc:''}));
  (rules.ignore_keywords||[]).forEach(k=>rows.push({t:'忽略词', title:k, desc:''}));
  if(kw) rows = rows.filter(r=>(r.title+' '+r.desc+' '+r.t).toLowerCase().includes(kw));
  const byType = {};
  rows.forEach(r=>{ (byType[r.t]=byType[r.t]||[]).push(r); });
  box.innerHTML = Object.entries(byType).map(([t,arr])=>`<div style="margin-bottom:6px;"><b>${esc(t)}（${arr.length}）</b>：${arr.map(r=>esc(r.title)).join('、')}</div>`).join('')
    || '<div>没有匹配的规则</div>';
}
function toggleSel(type, idx, ch){
  const m = type==='req' ? reqSel : genSel;
  if(ch) m[idx]=1; else delete m[idx];
}
async function delRule(kind, index, key){
  if(!confirm('删除该规则？')) return;
  const res = await fetch('/api/rules/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({kind, index:index??null, key:key||''})});
  const d = await res.json();
  if(!res.ok){ alert(d.detail||'失败'); return; }
  alert(d.note||'已删除'); load();
}
async function batchDel(kind){
  const m = kind==='requirement' ? reqSel : genSel;
  const indices = Object.keys(m).map(Number).sort((a,b)=>a-b);
  if(!indices.length){ alert('请先勾选要删除的条目'); return; }
  if(!confirm(`批量删除 ${indices.length} 条？`)) return;
  const res = await fetch('/api/rules/batch-delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({kind, indices})});
  const d = await res.json();
  if(!res.ok){ alert(d.detail||'失败'); return; }
  alert(d.note||'已删除'); reqSel={}; genSel={}; load();
}
function editRule(key){
  const cur = rules[key];
  const v = prompt(`修改「${meta[key]?.label||key}」（当前：${cur}）：`, cur);
  if(v===null) return;
  const num = Number(v);
  if(isNaN(num)){ alert('请输入有效数值'); return; }
  saveRulesPatch({[key]: num});
}
async function saveRulesPatch(patch){
  const res = await fetch('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({...rules, ...patch})});
  const d = await res.json();
  if(!res.ok){ alert('保存失败: '+(d.detail||JSON.stringify(d))); return; }
  alert('已保存并写入历史'); load();
}
function converse(){
  const instr = $('ruleIn').value.trim();
  if(!instr){ alert('请输入规则需求'); return; }
  $('converseMsg').textContent = '';
  // 弹出对话窗口：有来有回确认，直到点「确认完成」→ finalize 结构化规则列表
  openChatBox({
    purpose: 'rule_dialogue',
    title: '规则对话（可多轮修正，直到确认完成）',
    initial: [{role:'user', content: instr}],
    onFinalize: onRuleFinalize,
  });
}
async function onRuleFinalize(resultText){
  // 一条线：对话中 AI 已逐条回显确认，点「确认完成」直接写入，不再二次勾选
  let drafts = [];
  try{
    drafts = JSON.parse(resultText);
  }catch(e){
    const m = resultText.match(/\[.*\]/s);
    drafts = m ? JSON.parse(m[0]) : [];
  }
  if(!Array.isArray(drafts) || !drafts.length){
    alert('AI 未整理出规则，结果：\n'+resultText.slice(0,500));
    return;
  }
  let n=0, failed=[];
  for(const dr of drafts){
    const res = await fetch('/api/rules/converse/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({draft: dr})});
    const d = await res.json();
    if(res.ok && d.ok) n++;
    else failed.push(dr.title||'?');
  }
  if(failed.length) alert(`已写入 ${n}/${drafts.length} 条；失败：${failed.join('、')}`);
  else alert(`已确认写入 ${n} 条规则`);
  $('converseMsg').textContent=''; $('ruleIn').value='';
  load();
}
async function extractRuleDoc(){
  const f = $('ruleDocFile').files[0];
  if(!f){ alert('请先选择规则文档'); return; }
  const fd = new FormData(); fd.append('file', f);
  const res = await fetch('/api/rules/template-extract',{method:'POST',body:fd});
  const d = await res.json();
  if(!res.ok){ alert('提取失败: '+JSON.stringify(d)); return; }
  window._ruleDocText = d.text||'';
  $('ruleDocHint').textContent = '已载入「'+(d.filename||'')+'」（'+d.text.length+' 字），可点「AI 批量理解」';
}
async function importRuleDoc(){
  if(!window._ruleDocText){ alert('请先载入规则文档'); return; }
  // 弹窗式多轮对话：AI 读文档逐条理解回显，用户可修正，确认完成 → finalize 规则数组直接写入
  const docPreview = window._ruleDocText.slice(0,3000);
  const forceType = $('ruleImportType') ? $('ruleImportType').value : '';
  const forceHint = forceType==='requirement' ? '（全部按分析要求处理）'
                  : forceType==='generation_requirement' ? '（全部按生成要求处理）' : '';
  openChatBox({
    purpose: 'rule_doc_import',
    title: '规则文档导入（AI 逐条理解确认，可多轮修正）',
    initial: [{role:'user', content:'请从以下规则文档中逐条理解并回显给我确认'+forceHint+'：\n'+docPreview}],
    extraContext: window._ruleDocText,
    onFinalize: onRuleFinalize,   // 复用规则 finalize（直接写入）
  });
}


function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
load();
</script>
</body>
</html>
